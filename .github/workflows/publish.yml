# Checks every push and pull request (forks included); on main, publishes dist/ to the `repo`
# branch, which the apps read from:
#   https://raw.githubusercontent.com/Makogai/tachiyomi-ios-extensions/repo/index.json
#
# `npm run validate` compares the build with the published index, so a changed extension whose
# versionCode was not bumped fails here instead of silently not reaching the apps.
#
# The check job only reads the repository: pull requests (including ones from forks) run with a
# read-only token and no secrets. Only the publish job can write, and it runs only for pushes to
# main in this repository, after the checks pass.
name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Typecheck, SDK and extension unit tests, every extension's tests.json against its
      # fixtures (Node harness), then validation: extension.json schema, headers, layout, unique
      # IDs, versionCode bumps. Builds dist/.
      - run: npm run check

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Makogai/tachiyomi-ios-extensions'
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Makogai/tachiyomi-ios-extensions'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish dist/ to the repo branch
        run: |
          cd dist
          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo

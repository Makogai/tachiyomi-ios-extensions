# Checks every push and pull request; on main, publishes dist/ to the `repo` branch, which the
# apps read from:
#   https://raw.githubusercontent.com/Makogai/tachiyomi-ios-extensions/repo/index.json
#
# `npm run validate` compares the build with the published index, so a changed extension whose
# versionCode was not bumped fails here instead of silently not reaching the apps.
name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # SDK unit tests, then every extension's tests.json against its fixtures (Node harness).
      - run: npm test
      # extension.json schema, required files, unique IDs, versionCode bumps; builds dist/.
      - run: npm run validate

      - name: Publish dist/ to the repo branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo
